<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WireBoard · Account & sites</title>
    <style>
      :root {
        --blue: #2563eb;
        --gray-50: #f8fafc;
        --gray-100: #f1f5f9;
        --gray-200: #e2e8f0;
        --gray-500: #64748b;
        --gray-700: #334155;
        --gray-900: #0f172a;
        --radius: 8px;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: var(--gray-900);
        max-width: 760px;
        margin: 0 auto;
        padding: 2em 1.5em 4em;
        background: white;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.9em;
        padding-bottom: 1em;
        margin-bottom: 2em;
        border-bottom: 1px solid var(--gray-200);
      }
      header img { height: 28px; }
      header h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--gray-700); }
      header .crumb { margin-left: auto; font-size: 13px; }
      header .crumb a { color: var(--blue); text-decoration: none; }
      header .crumb a:hover { text-decoration: underline; }
      h2 {
        font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--gray-500);
        margin: 2em 0 0.6em;
      }
      .card {
        background: var(--gray-50);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        padding: 1em 1.2em;
      }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--gray-200); }
      tr:last-child td { border-bottom: 0; }
      th {
        background: var(--gray-100);
        font-weight: 600; font-size: 11px;
        text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--gray-500);
      }
      code {
        font: 12px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        background: var(--gray-100); padding: 2px 6px; border-radius: 4px; color: var(--gray-700);
      }
      .muted { color: var(--gray-500); }
      .error {
        background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
        padding: 0.8em 1em; border-radius: var(--radius);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="https://wireboard.io/img/logo-blue.png" alt="WireBoard" />
      <h1>Account &amp; sites</h1>
      <span class="crumb"><a href="./">all examples</a></span>
    </header>

    <p class="muted">Demonstrates <code>wb.account()</code> and <code>wb.sites()</code>.</p>

    <h2>Account</h2>
    <div class="card" id="account"><span class="muted">loading…</span></div>

    <h2>Sites</h2>
    <table id="sites"><tbody><tr><td class="muted">loading…</td></tr></tbody></table>

    <script type="module">
      import { WireBoardClient } from 'https://esm.sh/@wireboard/api';

      const token = localStorage.WIREBOARD_TOKEN;
      if (!token) {
        document.body.insertAdjacentHTML('beforeend',
          '<p class="error">No token. Set <code>localStorage.WIREBOARD_TOKEN</code> and reload.</p>');
        throw new Error('no token');
      }

      const wb = new WireBoardClient({ token });

      const account = await wb.account();
      document.getElementById('account').innerHTML =
        `<b>${account.name}</b> &lt;${account.email}&gt; ` +
        `<span class="muted">— abilities: ${account.abilities.join(', ')}</span>`;

      const { sites } = await wb.sites();
      const rows = sites.map((s) => `
        <tr>
          <td><code>${s.id}</code></td>
          <td>${s.domain}</td>
          <td>${s.max_30d ?? '—'}</td>
        </tr>`).join('');
      document.getElementById('sites').innerHTML =
        '<thead><tr><th>id</th><th>domain</th><th>max 30d</th></tr></thead><tbody>' + rows + '</tbody>';
    </script>
  </body>
</html>
